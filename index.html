<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Joe's Retirement Countdown</title>
<meta name="description" content="Countdown to Joe's retirement — Thursday, December 10, 2026 at noon Central." />
<style>
  :root {
    --text: #fffdf8;
    --muted: rgba(255,255,255,.92);
    --card: rgba(84, 52, 39, .34);
    --card-border: rgba(255,255,255,.08);
    --shadow: 0 22px 70px rgba(45,18,8,.30);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: clamp(14px, 2.1vw, 30px);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 50% 16%, rgba(255,255,255,.65), transparent 20%),
      linear-gradient(180deg, #fffdf9 0%, #f6f4f1 100%);
  }

  .frame {
    position: relative;
    width: min(96vw, 1600px);
    aspect-ratio: 16 / 9;
    min-height: 620px;
    overflow: hidden;
    border-radius: clamp(22px, 2.4vw, 40px);
    box-shadow: 0 18px 60px rgba(0,0,0,.10);
    isolation: isolate;
    background:
      radial-gradient(circle at 28% 42%, rgba(255,214,107,.88) 0 8%, transparent 27%),
      linear-gradient(180deg,
        #eba979 0%,
        #f6bc84 20%,
        #f9c477 38%,
        #f69068 63%,
        #c96e55 76%,
        #80635a 78%,
        #6d5a55 82%,
        #c98a63 88%,
        #a85e4c 100%);
  }

  /* Soft ocean / horizon */
  .frame::before {
    content: "";
    position: absolute;
    inset: 70% -8% -8% -8%;
    z-index: -2;
    background:
      linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 22%),
      repeating-linear-gradient(180deg,
        rgba(255,236,218,.26) 0 3px,
        rgba(147,92,73,.10) 4px 8px,
        rgba(255,255,255,.10) 9px 12px),
      linear-gradient(180deg, #8b7770 0%, #886a62 28%, #c68262 60%, #9c5949 100%);
    filter: blur(.3px);
  }

  /* Warm haze */
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse at 18% 62%, rgba(255,240,178,.34), transparent 36%),
      radial-gradient(ellipse at 67% 22%, rgba(255,224,200,.22), transparent 40%),
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.08));
    pointer-events: none;
  }

  .palm-left, .palm-right {
    position: absolute;
    top: -8%;
    width: 33%;
    height: 48%;
    opacity: .86;
    filter: blur(1.3px) drop-shadow(0 8px 18px rgba(0,0,0,.16));
    pointer-events: none;
  }

  .palm-left { left: -3%; transform: rotate(-7deg); }
  .palm-right { right: -3%; transform: scaleX(-1) rotate(-7deg); }

  .leaf {
    position: absolute;
    left: 3%;
    top: 2%;
    width: 78%;
    height: 16%;
    border-radius: 100% 0 100% 0;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, rgba(27,20,15,.97), rgba(32,23,18,.82) 70%, rgba(41,28,20,.25));
  }
  .leaf:nth-child(1){ transform: rotate(8deg) scaleX(1.05); }
  .leaf:nth-child(2){ transform: rotate(20deg) translateY(9px) scaleX(.98); }
  .leaf:nth-child(3){ transform: rotate(32deg) translateY(15px) scaleX(.89); }
  .leaf:nth-child(4){ transform: rotate(44deg) translateY(21px) scaleX(.78); }
  .leaf:nth-child(5){ transform: rotate(57deg) translateY(26px) scaleX(.70); }
  .leaf:nth-child(6){ transform: rotate(70deg) translateY(30px) scaleX(.60); }

  .content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(48px, 6vh, 92px) clamp(22px, 5vw, 90px) clamp(40px, 5vh, 72px);
  }

  .icon {
    font-size: clamp(42px, 4.7vw, 76px);
    line-height: 1;
    margin-bottom: clamp(12px, 1.6vh, 22px);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.16));
  }

  h1 {
    margin: 0 0 clamp(34px, 4.5vh, 58px);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 6.2vw, 96px);
    line-height: .98;
    font-weight: 700;
    letter-spacing: -.025em;
    text-shadow: 0 2px 16px rgba(76,35,23,.20);
  }

  .countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.25vw, 24px);
    width: 100%;
    margin-bottom: clamp(30px, 4.4vh, 56px);
  }

  .unit {
    width: clamp(155px, 15vw, 235px);
    aspect-ratio: 0.82;
    min-height: 188px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: clamp(22px, 2vw, 32px);
    background: linear-gradient(180deg, rgba(107,80,53,.33), rgba(103,50,37,.42));
    border: 1px solid var(--card-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 8px 30px rgba(75,40,30,.08);
    backdrop-filter: blur(2px);
  }

  .num {
    font-weight: 800;
    font-size: clamp(66px, 8.2vw, 126px);
    line-height: .9;
    letter-spacing: -.055em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 12px rgba(74,30,22,.13);
  }

  .label {
    margin-top: clamp(20px, 3vh, 34px);
    font-size: clamp(18px, 1.8vw, 31px);
    letter-spacing: .10em;
    font-weight: 500;
  }

  .colon {
    font-size: clamp(34px, 4.4vw, 70px);
    font-weight: 300;
    opacity: .78;
    transform: translateY(-6%);
    text-shadow: 0 2px 9px rgba(0,0,0,.08);
  }

  .subtitle {
    max-width: 92%;
    min-height: 1.35em;
    margin: 0 0 clamp(12px, 1.5vh, 20px);
    font-size: clamp(25px, 2.6vw, 43px);
    line-height: 1.15;
    font-weight: 400;
    letter-spacing: -.018em;
    text-shadow: 0 2px 12px rgba(76,35,23,.22);
    opacity: 1;
    transform: translateY(0);
    transition: opacity .45s ease, transform .45s ease;
  }

  .subtitle.changing {
    opacity: 0;
    transform: translateY(8px);
  }

  .date {
    margin: 0;
    font-size: clamp(19px, 2vw, 34px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--muted);
    text-shadow: 0 2px 10px rgba(76,35,23,.20);
  }

  .finished {
    display: none;
    width: min(900px, 90%);
    padding: 32px 36px;
    border-radius: 26px;
    background: rgba(83,42,29,.34);
    backdrop-filter: blur(3px);
    font-size: clamp(36px, 5vw, 76px);
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    line-height: 1.05;
  }

  .tiny-note {
    position: absolute;
    right: 18px;
    bottom: 12px;
    font-size: 11px;
    opacity: .0;
    user-select: none;
  }

  @media (max-width: 900px) {
    body { padding: 0; background: #ce7657; }
    .frame {
      width: 100vw;
      min-height: 100vh;
      aspect-ratio: auto;
      border-radius: 0;
    }
    .content { padding: 40px 14px 34px; }
    .countdown { gap: 7px; }
    .unit { width: 21.5vw; min-height: 152px; }
    .colon { font-size: 30px; }
    .label { letter-spacing: .06em; }
    .palm-left, .palm-right { width: 48%; height: 34%; }
  }

  @media (max-width: 560px) {
    h1 { margin-bottom: 30px; }
    .icon { margin-bottom: 10px; }
    .countdown { gap: 4px; }
    .unit { min-height: 125px; border-radius: 16px; }
    .num { font-size: clamp(44px, 14vw, 76px); }
    .label { margin-top: 15px; font-size: clamp(11px, 3vw, 16px); }
    .colon { font-size: 24px; }
    .subtitle { max-width: 96%; }
  }
</style>
</head>
<body>
  <main class="frame" role="main" aria-label="Joe's retirement countdown">
    <div class="palm-left" aria-hidden="true">
      <i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i>
    </div>
    <div class="palm-right" aria-hidden="true">
      <i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i>
    </div>

    <section class="content">
      <div class="icon" aria-hidden="true">🌴</div>
      <h1>JOE'S RETIREMENT</h1>

      <div id="countdown" class="countdown" aria-live="polite">
        <div class="unit"><div id="days" class="num">00</div><div class="label">DAYS</div></div>
        <div class="colon">:</div>
        <div class="unit"><div id="hours" class="num">00</div><div class="label">HOURS</div></div>
        <div class="colon">:</div>
        <div class="unit"><div id="minutes" class="num">00</div><div class="label">MIN</div></div>
        <div class="colon">:</div>
        <div class="unit"><div id="seconds" class="num">00</div><div class="label">SEC</div></div>
      </div>

      <p id="rotating-message" class="subtitle">Until “please do the needful” is no longer my action item</p>
      <p class="date">Thursday, December 10, 2026</p>
      <div id="finished" class="finished">RETIRED. 🎉<br><span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:.48em;font-weight:500;">No longer accepting “one quick questions.”</span></div>
    </section>
  </main>

<script>
(function () {
  // December 10, 2026 is Central Standard Time (UTC-6).
  const target = new Date('2026-12-10T12:00:00-06:00').getTime();
  const ids = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds')
  };
  const countdown = document.getElementById('countdown');
  const finished = document.getElementById('finished');
  const rotatingMessage = document.getElementById('rotating-message');

  const messages = [
    'Until “please do the needful” is no longer my action item',
    'Until every “one quick question” becomes someone else\'s problem',
    'Until “can you jump on a quick call?” gets an automatic NO',
    'Until “please advise” becomes someone else\'s responsibility',
    'My countdown to freedom. Your countdown to figuring it out.'
  ];
  let messageIndex = 0;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function update() {
    const now = Date.now();
    let diff = target - now;

    if (diff <= 0) {
      Object.values(ids).forEach(el => el.textContent = '00');
      countdown.style.display = 'none';
      finished.style.display = 'block';
      return;
    }

    const day = 24 * 60 * 60 * 1000;
    const hour = 60 * 60 * 1000;
    const minute = 60 * 1000;

    const days = Math.floor(diff / day);
    diff %= day;
    const hours = Math.floor(diff / hour);
    diff %= hour;
    const minutes = Math.floor(diff / minute);
    diff %= minute;
    const seconds = Math.floor(diff / 1000);

    ids.days.textContent = String(days).padStart(2, '0');
    ids.hours.textContent = pad2(hours);
    ids.minutes.textContent = pad2(minutes);
    ids.seconds.textContent = pad2(seconds);
  }

  function rotateMessage() {
    if (!rotatingMessage) return;
    rotatingMessage.classList.add('changing');

    setTimeout(() => {
      messageIndex = (messageIndex + 1) % messages.length;
      rotatingMessage.textContent = messages[messageIndex];
      rotatingMessage.classList.remove('changing');
    }, 450);
  }

  update();
  setInterval(update, 1000);
  setInterval(rotateMessage, 4000);
})();
</script>
</body>
</html>
